    <aside class="col col-right" aria-label="News">
      <div class="feed-head" id="feedHead"></div>
      <div class="feed-tools">
        <label class="sr-only" for="newsSearch">News durchsuchen</label>
        <input id="newsSearch" type="search" placeholder="News durchsuchen …" autocomplete="off">
        <div class="src" id="src" role="group" aria-label="Quelle"></div>
      </div>
      <section class="grid" id="feed" aria-label="Meldungen"></section>
      <p class="sources-note">Die Meldungen stammen aus einer festen Auswahl von Basketball-Portalen (Sportando, Eurohoops, BasketNews, RealGM) und werden täglich zusammengefasst. Resultate, Spielplan und Live-Stände kommen direkt von der EuroLeague.</p>
    </aside>
  </div>
  <nav class="mtabs" aria-label="Ansicht">
    <button type="button" data-tab="spiel"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3v18M6 6c3 3 3 9 0 12M18 6c-3 3-3 9 0 12"/></svg><span>Spieltag</span></button>
    <button type="button" data-tab="news"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v12H8l-4 4z"/></svg><span>News</span><b class="badge num" id="newsBadge" hidden></b></button>
    <button type="button" data-tab="teams"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 2.6 5.6 6 .7-4.5 4.1 1.2 6L12 16.4 6.7 19.4l1.2-6L3.4 9.3l6-.7z"/></svg><span>Teams</span></button>
  </nav>

  <dialog class="box" id="playerDlg" aria-labelledby="playerTitle"></dialog>
  <div class="toast" id="toast" role="status" hidden></div>
  <script type="module" src="gate.js"></script>

</html>
