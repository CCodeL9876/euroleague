  <link rel="apple-touch-icon" href="../icon-180.png">
  <link rel="manifest" href="../manifest.webmanifest">

  <link rel="stylesheet" href="fussball.css">

<body data-app="./fussball/fussball.js">
  <div class="fb">
    <header class="fb-top">
      <div class="fb-brand"><svg class="fb-mark" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 7.6l3.7 2.7-1.4 4.4H9.7l-1.4-4.4z"/><path d="M12 7.6V2.6M15.7 10.3l4.6-1.6M14.3 14.7l3 4M9.7 14.7l-3 4M8.3 10.3l-4.6-1.6"/></svg>

      <button type="button" class="theme-btn" id="themeBtn" data-act="theme" aria-label="Hell oder dunkel"></button>
      <button type="button" class="theme-btn profile-btn" id="profileBtn" data-act="profile-menu" aria-haspopup="menu" aria-expanded="false" aria-controls="profileMenu" aria-label="Profil"></button>
      <div class="profile-menu" id="profileMenu" role="menu" aria-label="Profil" hidden></div>
    </header>
    <nav class="fb-days" id="fbDays" aria-label="Tag"></nav>
    <main class="fb-list" id="fbList" aria-live="polite"><p class="fb-empty">Lade Spiele …</p></main>

  <nav class="fb-tabs" aria-label="Ansicht">

    <a class="fb-tab-bb" href="../"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3v18M6 6c3 3 3 9 0 12M18 6c-3 3-3 9 0 12"/></svg><span>Basketball</span></a>

  <script type="module" src="../gate.js"></script>
